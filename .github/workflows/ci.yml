name: CI Docker

on:
  push:
  pull_request:

env:
  IMAGE: activite1:ci
  MAX_SIZE_MB: 60

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: Build
        run: docker build -t "$IMAGE" .

      - name: Contrôle du poids (< 60 Mo)
        run: |
          docker images "$IMAGE"
          # Somme des couches non compressées (indépendant du stockage Docker utilisé)
          size=$(docker history "$IMAGE" --human=false --format '{{.Size}}' | awk '{s+=$1} END {print s}')
          max=$((MAX_SIZE_MB * 1000 * 1000))
          echo "Taille de l'image : ${size} octets (limite : ${max})"
          if [ "$size" -ge "$max" ]; then
            echo "::error::Image trop lourde : ${size} octets >= ${MAX_SIZE_MB} Mo"
            exit 1
          fi

      - name: Smoke test HTTP
        run: |
          docker run -d --name smoke -p 5000:5000 "$IMAGE"
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/ || true)
            [ "$code" = "200" ] && echo "GET / -> 200 OK" && break
            sleep 1
          done
          docker logs smoke
          [ "$code" = "200" ] || { echo "::error::GET / a renvoyé '$code' au lieu de 200"; exit 1; }

      - name: Vérification utilisateur non-root
        run: |
          uid=$(docker exec smoke id -u)
          echo "UID dans le conteneur : $uid"
          [ "$uid" != "0" ] || { echo "::error::Le conteneur tourne en root"; exit 1; }

      - name: Nettoyage
        if: always()
        run: docker rm -f smoke || true
